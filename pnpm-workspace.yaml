packages:
  - apps/*
  - packages/*

# Versiones compartidas por todo el monorepo (se usan con "catalog:" en cada package.json).
catalog:
  typescript: 6.0.3
  '@types/node': 22.20.5
  # ESLint 9: los plugins de eslint-config-next (react, import, jsx-a11y) aún no admiten ESLint 10.
  eslint: 9.39.5
  '@eslint/js': 9.39.5
  typescript-eslint: 8.72.2
  eslint-config-next: 16.4.6
  eslint-config-prettier: 10.1.8
  prettier: 3.10.1
  # Vitest 5 exige Node >=22.12 (engines de la raíz).
  vitest: 5.1.0
  '@vitest/coverage-v8': 5.1.0
  vite: 8.3.8
  # Capa de datos (@hf/db). drizzle 1.0 sigue en release candidate; postgres.js 3.x es la probada con drizzle 0.45.
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  postgres: 3.4.9
  next: 16.4.6
  react: 19.3.1
  react-dom: 19.3.1
